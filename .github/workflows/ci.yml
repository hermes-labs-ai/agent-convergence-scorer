name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -ra

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install "build~=1.2" "hatchling>=1.27,<1.31" "twine>=6.2" "pkginfo>=1.12"

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      - name: Verify package metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the action against its documented JSON input
        id: convergence
        uses: ./
        with:
          input: examples/runs.json
          min-convergence: "0"

      - name: Assert action outputs
        shell: bash
        env:
          SCORE: ${{ steps.convergence.outputs.convergence_score }}
          EXACT: ${{ steps.convergence.outputs.exact_match_rate }}
          RESULT: ${{ steps.convergence.outputs.result_path }}
        run: |
          test "$SCORE" = "1.0"
          test "$EXACT" = "1.0"
          test -f "$RESULT"
